[unpacker]
; Required absolute directory for extracted files.
OutputDir=
; Optional resource path scope. Both slash styles are accepted.
Scope=
; Freeze the client at this app step. Step 1 is pre-render: the whole corpus is
; already mapped and fixed-up there, so no login/server/world load is needed.
FreezeStep=1
; Run the extraction worker (waits for a WRITE_NOW sentinel file).
Extract=1
; Stop after N resources (0 = the whole pack). For quick verification runs.
Limit=0
